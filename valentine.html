<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Valentine 💘</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: "Comic Sans MS", cursive;
      background: linear-gradient(to bottom, #ffb6c1, #ffe6f0);
      overflow: hidden;
      text-align: center;
    }

    h1 {
      margin-top: 80px;
      font-size: 2.2rem;
      color: #b30059;
    }

    button {
      font-size: 1.3rem;
      padding: 15px 30px;
      border: none;
      border-radius: 15px;
      cursor: pointer;
      transition: 0.2s;
    }

    #yesBtn {
      background-color: #ff4da6;
      color: white;
      z-index: 10;
    }

    #noBtn {
      background-color: white;
      color: black;
      position: absolute;
      z-index: 10;
    }

    /* Intro overlay */
    #startScreen {
      position: fixed;
      top: 0;
      left: 0;
      height: 100%;
      width: 100%;
      background: rgba(255, 182, 193, 0.97);
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      z-index: 999;
    }

    #startBtn {
      background-color: #ff4da6;
      color: white;
      font-size: 1.5rem;
      padding: 20px 40px;
      border-radius: 20px;
    }

    /* Floating hearts */
    .heart {
      position: absolute;
      bottom: -20px;
      font-size: 24px;
      animation: floatUp 6s linear infinite;
    }

    @keyframes floatUp {
      0% { transform: translateY(0); opacity: 1; }
      100% { transform: translateY(-900px); opacity: 0; }
    }

    /* Explosion hearts */
    .boomHeart {
      position: absolute;
      font-size: 30px;
      animation: explode 1s ease-out forwards;
    }

    @keyframes explode {
      0% { transform: scale(1); opacity: 1; }
      100% {
        transform: scale(2) translate(var(--x), var(--y));
        opacity: 0;
      }
    }

    /* Love letter popup */
    #loveLetter {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: white;
      padding: 30px;
      border-radius: 25px;
      box-shadow: 0 0 20px rgba(0,0,0,0.3);
      width: 85%;
      max-width: 400px;
      z-index: 9999;
    }

    #loveLetter h2 {
      color: #ff0066;
    }

    #closeLetter {
      margin-top: 15px;
      background: #ff4da6;
      color: white;
    }
  </style>
</head>

<body>

  <!-- Tap to Start Screen -->
  <div id="startScreen">
    <h1>Hi Silvia 💕</h1>
    <button id="startBtn">Tap to start 💘</button>
  </div>

  <h1>Silvia… will you be my Valentine? 💘</h1>

  <button id="yesBtn">Yes 💖</button>
  <button id="noBtn">No 💔</button>

  <!-- Love Letter Popup -->
  <div id="loveLetter">
    <h2>💌 My Love Letter to You, Silvia</h2>
    <p>
      Silvia… you make my life sweeter, brighter, and happier.<br><br>
      I don’t need a special day to love you…  
      but I want this Valentine’s Day to be ours 💕<br><br>
      Kiss kiss kiss 💋💋💋<br><br>
      <b>Love, Amir</b>
    </p>
    <button id="closeLetter">Awww 💖</button>
  </div>

  <!-- Romantic Music -->
  <audio id="music" loop>
    <source src="https://www.bensound.com/bensound-music/bensound-romantic.mp3" type="audio/mp3">
  </audio>

  <script>
    const startScreen = document.getElementById("startScreen");
    const startBtn = document.getElementById("startBtn");
    const music = document.getElementById("music");

    const noBtn = document.getElementById("noBtn");
    const yesBtn = document.getElementById("yesBtn");

    const loveLetter = document.getElementById("loveLetter");
    const closeLetter = document.getElementById("closeLetter");

    let yesSize = 1.3;

    // Start button enables music
    startBtn.addEventListener("click", () => {
      startScreen.style.display = "none";
      music.play();
    });

    // Move No button randomly
    function moveNoButton() {
      const x = Math.random() * (window.innerWidth - 120);
      const y = Math.random() * (window.innerHeight - 80);

      noBtn.style.left = x + "px";
      noBtn.style.top = y + "px";
    }

    // Impossible No button
    document.addEventListener("mousemove", (e) => {
      const rect = noBtn.getBoundingClientRect();
      const distance = Math.hypot(
        e.clientX - (rect.left + rect.width / 2),
        e.clientY - (rect.top + rect.height / 2)
      );

      if (distance < 130) {
        moveNoButton();

        yesSize += 0.15;
        yesBtn.style.fontSize = yesSize + "rem";
      }
    });

    // Floating hearts
    function createHeart() {
      const heart = document.createElement("div");
      heart.classList.add("heart");
      heart.innerHTML = "💖";

      heart.style.left = Math.random() * window.innerWidth + "px";
      heart.style.animationDuration = (Math.random() * 3 + 3) + "s";

      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 6000);
    }
    setInterval(createHeart, 400);

    // Explosion hearts
    function heartExplosion() {
      for (let i = 0; i < 35; i++) {
        const boom = document.createElement("div");
        boom.classList.add("boomHeart");
        boom.innerHTML = "💖";

        boom.style.setProperty("--x", (Math.random() * 400 - 200) + "px");
        boom.style.setProperty("--y", (Math.random() * 400 - 200) + "px");

        boom.style.left = (window.innerWidth / 2) + "px";
        boom.style.top = (window.innerHeight / 2) + "px";

        document.body.appendChild(boom);
        setTimeout(() => boom.remove(), 1000);
      }
    }

    // YES clicked 💘
    yesBtn.addEventListener("click", () => {
      heartExplosion();

      setTimeout(() => {
        loveLetter.style.display = "block";
      }, 1000);
    });

    // Close love letter
    closeLetter.addEventListener("click", () => {
      loveLetter.style.display = "none";
      document.body.innerHTML = `
        <h1 style="margin-top:150px; font-size:2.7rem; color:#ff0066;">
          Silvia said YES 💕🥰<br>
          Happy Valentine’s Day!!
        </h1>
        <p style="font-size:1.6rem;">
          Kiss kiss kiss 💋💋💋<br><br>
          <b>Love, Amir</b>
        </p>
      `;
    });

    moveNoButton();
  </script>

</body>
</html>
